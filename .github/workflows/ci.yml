# ci.yml —— 最小可信 CI
#
# 原则（与 ROADMAP/协议一致）：
#   * 三平台：ubuntu（TSan/ASan 可跑）+ macos（clang，第三个工具链哨兵）+
#     windows（本仓库的主开发平台，MinGW）；
#   * 护栏与测试同门槛：check_layers / check_header_only / 生成器 --check 与 ctest
#     一起进必过清单——护栏只在本地跑等于没有护栏；
#   * 不追矩阵花样：preset 名与 CMakePresets.json 一一对应，改预设必须同步这里。

name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  guardrails:
    name: guardrails (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 分层校验
        run: python tools/check_layers.py
      - name: 头文件自洽
        run: python tools/check_header_only.py
      - name: 生成物与生成器一致
        run: |
          python tools/gen_unicode_tables.py --check
          python tools/gen_grapheme_tables.py --check
          python tools/gen_braille_table.py --check
          python tools/gen_turbo_table.py --check
          python tools/gen_dsl_samples.py --check
          python tools/gen_fixtures.py --check
          python tools/gen_module_graph.py --check
          python tools/gen_single_header.py --check
          python tools/check_headers.py --compiler c++ --include "$PWD/include"
      - name: TopoJSON 缝合回归
        run: python tools/tests/test_topojson_stitch.py

  linux:
    name: ubuntu (gcc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 配置
        run: cmake --preset debug
      - name: 构建
        run: cmake --build build/debug -j 4
      - name: 测试
        run: ctest --test-dir build/debug --output-on-failure

  macos:
    name: macos (clang)
    # macos-14 在本仓库账户下连续多次「0 步骤即 cancelled」（job 从未分配 runner），
    # 改用当前 GitHub 默认标签，让第三个工具链哨兵真正跑起来。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: 配置
        run: cmake --preset ninja
      - name: 构建
        run: cmake --build build/ninja -j 4
      - name: 测试
        run: ctest --test-dir build/ninja --output-on-failure

  windows:
    name: windows (mingw)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            python
      - name: 配置
        run: cmake -S . -B build/ci-windows -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: 构建
        run: cmake --build build/ci-windows -j 4
      - name: 测试
        run: ctest --test-dir build/ci-windows --output-on-failure

  sanitizers:
    name: ubuntu (asan+ubsan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 配置
        run: cmake --preset asan
      - name: 构建
        run: cmake --build build/asan -j 4
      - name: 测试
        run: ctest --test-dir build/asan --output-on-failure

  # TSan 只在 Linux 上跑：MinGW 没有 libtsan（windows 作业因此不碰它，
  # 见 cmake/Sanitizers.cmake 的平台说明）。
  tsan:
    name: ubuntu (tsan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 配置
        run: cmake --preset tsan
      - name: 构建
        run: cmake --build build/tsan -j 4
      - name: 测试
        run: ctest --test-dir build/tsan --output-on-failure

  coverage:
    name: ubuntu (coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 装 gcovr
        run: pip install gcovr
      - name: 配置
        run: cmake --preset coverage
      - name: 构建
        run: cmake --build build/coverage -j 4
      - name: 测试
        run: ctest --test-dir build/coverage --output-on-failure
      - name: 汇总
        run: |
          gcovr --root . \
            --exclude 'tests/.*' --exclude 'examples/.*' \
            --exclude 'bench/.*' --exclude 'third_party/.*' \
            --exclude 'single_include/.*' --print-summary

  # 编码器认证：库内测试只过自家独立 VP8L 解码器；此作业用真实解码器（Pillow / ffprobe）
  # 校验产出可被外部消费。webp 测试的「落盘」用例写出 tc_webp*.webp 供此处交叉校验。
  encoder-cert:
    name: encoder cert (PIL/ffmpeg 真实解码器)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 装真实解码器工具
        run: |
          pip install pillow
          sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: 配置
        run: cmake --preset ninja
      - name: 构建测试
        run: cmake --build build/ninja --target termchart_tests -j 4
      - name: 落盘 WebP 供外部校验
        run: |
          cd build/ninja/tests
          ./termchart_tests -tc='*webp*'
      - name: PIL / ffprobe 认证
        run: |
          cd build/ninja/tests
          python -c "
          from PIL import Image
          for f in ['tc_webp.webp', 'tc_webp_gradient.webp', 'tc_webp_odd.webp']:
              im = Image.open(f); im.load()
              print('PIL OK', f, im.size, im.mode)
          "
          ffprobe -v error -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 tc_webp.webp

  wasm:
    name: wasm (emscripten 真编译)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache
      - name: 构建依赖（preset 用 ccache 作为 EM_COMPILER_WRAPPER）
        run: sudo apt-get update && sudo apt-get install -y ccache ninja-build
      - name: 配置
        run: cmake --preset wasm
      - name: 构建（含 wasm-ld 真链接，不是只编译 .o）
        # ninja -k 0：一次报出全部编译错误，避免每轮只冒一个头文件缺失
        run: cmake --build build/wasm -j 2 -- -k 0
      - name: 产物校验
        run: |
          test -s build/wasm/termchart_wasm.wasm
          ls -l build/wasm/termchart_wasm.wasm build/wasm/termchart_wasm.js

[build-system]
requires = ["scikit-build-core>=0.5", "pybind11>=2.10"]
build-backend = "scikit_build_core.build"

[project]
name = "termchart"
version = "0.1.0"
description = "Zero-mandatory-dependency terminal charting for Python"
requires-python = ">=3.9"

[tool.scikit-build]
cmake.source-dir = ".."
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
TERMCHART_BUILD_PYTHON = "ON"
TERMCHART_BUILD_TESTS = "OFF"
TERMCHART_BUILD_EXAMPLES = "OFF"

# mkdocs.yml —— 文档站导航
#
# 运行：mkdocs serve / mkdocs build（产物默认 site/）
# 注意：mkdocs 的 docs_dir 是 docs/，nav 只能引用 docs/ 内的文件；
# 根目录的 ROADMAP.md / 结构.md / README.md 不进站（构建会因找不到文件而失败），
# 由 docs/ 内页面用相对链接 ../ROADMAP.md 引用。
# Doxygen 产物 build/doxygen/html 不挂进 mkdocs，构建后本地浏览。

site_name: termchart
site_description: 零强制依赖的 C++20 终端图表库
repo_url: https://github.com/Jackey7980/teamchart
repo_name: Jackey7980/teamchart

nav:
  - 30 秒上手: guide/quickstart_30s.md
  - 指南:
      - 第一个图表: guide/first_chart.md
      - 怎么选图: guide/choosing_chart.md
      - 图可视化: guide/graph_diagrams.md
      - DSL 参考: guide/dsl_reference.md
      - 主题与配色: guide/theming.md
      - 导出: guide/exporting.md
      - 交互: guide/interaction.md
      - App 与 Widget: guide/app_and_widget.md
      - 插件: guide/plugins.md
      - 单头分发: guide/single_header.md
      - 最小构建: guide/minimal_build.md
      - 性能: guide/performance.md
      - 图像: guide/images.md
      - 背景数据: guide/background_data.md
      - 数据管线: guide/data_pipeline.md
      - 数学与几何工具集: guide/math_toolkit.md
      - 3D 与 4D: guide/three_d.md
      - 网络: guide/network.md
      - 扩展点:
          - 自定义图表: guide/custom_chart.md
          - 自定义后端: guide/custom_backend.md
          - 自定义光栅器: guide/custom_rasterizer.md
  - 语言桥与 FFI:
      - C ABI 与 Python 桥: guide/c_api.md
      - Python（pybind11）: guide/python_bridge.md
      - FFI / 桥方案: design/ffi_plan.md
  - 参考:
      - 能力矩阵: reference/capability_matrix.md
      - 模块矩阵: reference/module_matrix.md
      - API 参考: reference/api.md
      - 质量待办: reference/quality_todo.md
      - 边界与限制: limits.md
  - 示例画廊: gallery.md
